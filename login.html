  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
 
  <header>
    <div class="logo">🐾 Veterinaria San Marcos</div>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" />
    <label for="nav-toggle" class="nav-toggle-label">☰</label>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>

      </ul>
    </nav>
  </header>
 
  <main>
    <section class="form-contenedor">
      <h2>Iniciar Sesión</h2>
      <form action="#" method="POST" class="form-auth">
        <div class="form-grupo">
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required />
        </div>

        <div class="form-grupo">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="Tu contraseña" required />
        </div>

        <button type="submit" class="btn">Ingresar</button>
      </form>
      <p class="form-pie">¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </section>
  </main>
 
  <footer>
    <p>Veterinaria San Marcos &middot; Rancagua &middot; contacto@sanmarcosvet.cl &middot; +56 9 0000 0000</p>
  </footer>
